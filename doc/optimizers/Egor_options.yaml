gp_config:
  desc: GpConfig as a dict used by Egor for surrogate model configuration
cstr_tol:
  desc: Constraint tolerances list passed to Egor (size n_cstr plus n_fcstr)
n_start:
  desc: Number of infill optimization runs (best run selected)
n_doe:
  desc: Number of initial DOE samples (0 lets Egor choose automatically)
doe:
  desc: Initial DOE array, either x-only or concatenated x and y
infill_strategy:
  desc: Infill criterion enum (EI, WB2, WB2S, LOG_EI)
cstr_infill:
  desc: Enable constrained infill criterion
cstr_strategy:
  desc: Constraint strategy enum for surrogate constraint handling
qei_config:
  desc: QEiConfig for batch (qEI) point selection
infill_optimizer:
  desc: Internal infill optimizer enum (COBYLA or SLSQP)
trego:
  desc: Enable TREGO (aka Trust Region EGO) algorithm
coego_n_coop:
  desc: Number of cooperative groups for CoEGO mode
target:
  desc: Known objective target used as stopping criterion
outdir:
  desc: Output directory for Egor history and warm start search
warm_start:
  desc: Load initial DOE from outdir when enabled
hot_start:
  desc: | 
    Egor checkpoint restart parameter to be used in case of fallible environment 
    to continue with the same Egor parameterization till max iterations or timeout is reached.
failsafe_strategy:
  desc: Failure handling enum (REJECTION, IMPUTATION, VIABILITY)
seed:
  desc: Seed for random number generator (default -1 for random seed)
verbose:
  desc: Constructor verbosity
max_iters:
  desc: Egor minimize iteration budget
run_info:
  desc: Optional RunInfo used to pass additional information to Egor (e.g., for logging)
timeout:
  desc: Optional minimize timeout in seconds
fcstrs:
  desc: Optional list of native Egobox function constraints passed to minimize
fcstr_specs:
  desc: Optional list of egobox.CstrSpec for function constraints passed as fcstrs
