gp_config:
  desc: |
    GpConfig as a dict used by Egor for surrogate model configuration.
    Main defaults are:

    - ``regr_spec``: 1 (Constant)
    - ``corr_spec``: 2 (Squared Exponential)
    - ``kpls_dim``: no PLS dimensionality reduction (otherwise int)
    - ``n_clusters``: no clustering (otherwise int)
    - ``theta_n_start``: number of multistart runs for GP hyperparameters optimization
    - ``theta_max_eval``: max number of likelihood evaluations for GP hyperparameters optimization
cstr_tols:
  desc: |
    Constraint tolerances list, one per pyOptSparse constraint row (in the order equality then inequality).
    pyOptSparse constraint bounds are passed to Egor as constraint specs
    (``leq``, ``geq``, ``eq`` or ``between``), each with its tolerance.
    Default is ``1e-4`` for all constraints. Tolerances of ``fcstrs`` are given with ``fcstr_specs``.
infill_n_start:
  desc: Number of infill optimization runs (best run selected)
n_doe:
  desc: Number of initial DOE samples (0 lets Egor choose automatically)
x_doe:
  desc: |
    Initial DOE inputs to be passed as list of lists of floats (n_samples x n_vars).
    If not provided, Egor will generate a DOE automatically.
y_doe:
  desc: |
    Optional outputs of the initial DOE ``x_doe`` (n_samples x (1 + n_cstr)), objective first then
    constraint values (equality then inequality constraints). If not provided, ``x_doe`` points are evaluated.
infill_strategy:
  desc: |
    Infill criterion:

    - 1 = ``EI``,
    - 2 = ``WB2``,
    - 3 = ``WB2S``,
    - 4 = ``LOG_EI`` (default)
feasible_infill_strategy:
  desc: |
    Expected Feasible Improvement to handle hidden constraints (points where the function fails):

    - 1 = ``NONE`` (default)
    - 2 = ``EFI_P``, criterion weighted by the probability of viability
    - 3 = ``EFI_FE``, feasibility enhanced variant, more exploratory

    Not available with ``LOG_EI`` infill criterion (use ``EI``, ``WB2`` or ``WB2S``).
cstr_infill:
  desc: Enable constrained infill criterion (aka CEI)
cstr_strategy:
  desc: |
    Constraint strategy enum for surrogate constraint handling:

    - 1 = ``MeanConstraint`` (default)
    - 2 = ``UpperConfidenceBound``
qei_config:
  desc: |
    QEiConfig for batch (qEI) point selection passed as a dict with main keys being:

    - ``batch``: size of batch (int)
    - ``strategy``: qEI strategy enum
    - ``optim_every``: hyperparameters optimization frequency within the batch
infill_optimizer:
  desc: |
    Internal infill optimizer:

    - 1 = ``COBYLA`` (default)
    - 2 = ``SLSQP``
trego:
  desc: |
    Enable TREGO (aka Trust Region EGO) algorithm configured with main parameters:

    - ``n_global_local_steps``: (nb of global search steps default 1, nb of local search steps default 4)
    - ``radius_bounds``: (min, max) bounds of the trust region radius
    - ``beta``: trust region factor (default 0.9)

coego_n_coop:
  desc: Number of cooperative groups for CoEGO algorithm
target:
  desc: Known objective target used as stopping criterion. Default is ``-inf`` (no target)
outdir:
  desc: Output directory for Egor output files (configuration, does, history and warm start search)
warm_start:
  desc: Load initial DOE from outdir when enabled
hot_start:
  desc: |
    Egor checkpoint restart parameter to be used in case of fallible environment
    to continue with the same Egor parameterization till max iterations or timeout is reached.
failsafe_strategy:
  desc: |
    Failure handling enum

    - 1 = ``REJECTION`` (default),
    - 2 = ``IMPUTATION``,
    - 3 = ``PROBA OF VIABILITY``
seed:
  desc: Seed for random number generator (default -1 for random seed)
verbose:
  desc: |
    Verbosity level for Egor logging

    - 0 = ``error`` (default)
    - 1 = ``warning``
    - 2 = ``info``
    - 3 = ``debug``
max_iters:
  desc: Egor iteration budget
run_info:
  desc: Optional RunInfo used to pass additional information to Egor (e.g., for logging)
timeout:
  desc: Optional timeout in seconds used as stopping criterion for Egor minimize
fcstrs:
  desc: |
    Optional list of native Egobox function constraints passed directly as fcstrs
    (instead of pyOptSparse constraints which are metamodelized)
fcstr_specs:
  desc: |
    Optional list of egobox.CstrSpec (or dict, e.g. ``{"leq": 0.0, "tol": 1e-3}``)
    for function constraints passed as fcstrs, giving bound and tolerance of each one
stop_on_error:
  desc: |
    Terminate the optimization when the objective function raises an error,
    otherwise the error is handled according to ``failsafe_strategy``
