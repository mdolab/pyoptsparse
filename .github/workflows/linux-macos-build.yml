name: PyOptSparse Linux/macOS Actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]  # macos-15 runners are arm64 (Apple Silicon)
        versions: [{python: "3.11", numpy: "1.25"}, {python: "3.12", numpy: "2.3"}]
    defaults:
      run:
        # login shell so the conda env activated by setup-miniconda is picked up in every step
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so setuptools_scm can find version tags
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.versions.python }}
          channels: conda-forge
          conda-remove-defaults: "true"
      - name: Install conda dependencies (numpy ${{ matrix.versions.numpy }})
        run: |
          # conda-forge compilers set CC/FC and the rpath to $CONDA_PREFIX/lib for libgfortran.
          # cyipopt from conda-forge ships with the IPOPT library; pip then sees it as already installed.
          conda install -y \
            c-compiler fortran-compiler pip \
            numpy=${{ matrix.versions.numpy }} \
            cyipopt
      - name: Build and install pyoptsparse
        run: |
          pip install .['testing']
      - name: Run tests
        run: |
          cd tests
          testflo -i --pre_announce -v -n 1 .
