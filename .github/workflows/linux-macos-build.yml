name: PyOptSparse Linux/macOS Actions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]  # macos-14 runners are arm64 (Apple Silicon)
        versions: [{python: "3.11", numpy: "1.25"}, {python: "3.12", numpy: "2.3"}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.versions.python }}
      - name: Set Fortran compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          # GitHub macOS runners ship gfortran via brew's gcc, but usually only as
          # a versioned binary (gfortran-14) without a bare `gfortran` symlink, so
          # point meson/f2py at the newest one explicitly.
          FC=$(ls -1 "$(brew --prefix)"/bin/gfortran* 2>/dev/null | sort -V | tail -1)
          echo "FC=${FC:-gfortran}" >> "$GITHUB_ENV"
      - name: Install runtime numpy ${{ matrix.versions.numpy }}
        run: |
          pip install -U pip wheel
          pip install numpy~=${{ matrix.versions.numpy }}
      - name: Build and install pyoptsparse
        run: |
          pip install .['testing']
      - name: Run tests
        run: |
          cd tests
          testflo -i --pre_announce -v -n 1 .
